<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Instagram - Inbox</title>
        <link rel="icon" href="instalogo.png" type="image/png">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                background-color: #ffffff;
                height: 100vh;
                overflow: hidden;
            }

            .container {
                display: flex;
                height: 100vh;
            }

            .sidebar-wrapper {
                width: 15%;
                border-right: 1px solid #e0e0e0;
                overflow-y: auto;
            }

            .messages-wrapper {
                width: 25%;
                border-right: 1px solid #e0e0e0;
                overflow-y: auto;
            }

            .content-wrapper {
                flex: 1;
                overflow: hidden;
            }

            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="sidebar-wrapper">
                <iframe src="sidebar.html" scrolling="auto"></iframe>
            </div>
            <div class="messages-wrapper">
                <iframe src="message.html" scrolling="auto"></iframe>
            </div>
            <div class="content-wrapper">
                <iframe src="i.html" scrolling="auto"></iframe>
            </div>
        </div>

        <script>
          window.onload = function() {
            var username = localStorage.getItem('instagramUsername');
            if (username) {
              document.title = '(4) ' + username + ' • Inbox';
            }
          };
        </script>
    </body>
</html>
