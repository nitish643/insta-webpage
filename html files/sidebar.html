<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Instagram - Sidebar</title>
        <link rel="icon" type="image/png" href="instalogo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #ffffff;
                height: 100vh;
                overflow: hidden;
            }

            nav.sidebar {
                display: flex;
                flex-direction: column;
                height: 100vh;
                background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
                border-right: 1px solid #e0e0e0;
                padding: 20px 0;
                overflow-y: auto;
            }

            .sidebar-header {
                font-family: 'Billabong', 'Brush Script MT', cursive;
                font-size: 36px;
                font-weight: 400;
                text-align: center;
                margin-bottom: 30px;
                color: #000;
                padding: 0 10px;
                letter-spacing: 1px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .sidebar-header img {
                width: 40px;
                height: 40px;
                object-fit: contain;
            }

            ul {
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 0 12px;
            }

            li {
                display: flex;
                align-items: center;
                padding: 12px 16px;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
            }

            li:hover {
                background-color: rgba(0, 0, 0, 0.05);
            }

            li.class-tool-tip {
                background-color: rgba(0, 0, 0, 0.08);
            }

            li img {
                width: 30px;
                height: 40px;
                border-radius: 50%;
                margin-right: 16px;
                object-fit: contain;
            }

            li img[class='profile'] {
                height: 50px;
                width: 50px;
                border-radius: 50%;
            }

            li p {
                font-size: 16px;
                font-weight: 500;
                color: #262626;
                margin: 0;
            }

            .class-tool-tip {
                position: relative;
            }

            .tool-tip {
                position: absolute;
                bottom: 8px;
                left: 32px;
                font-size: 12px;
                font-weight: 700;
                background-color: #f91880;
                color: white;
                border-radius: 50%;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
            }

            nav.sidebar::-webkit-scrollbar {
                width: 6px;
            }

            nav.sidebar::-webkit-scrollbar-track {
                background: transparent;
            }

            nav.sidebar::-webkit-scrollbar-thumb {
                background: #ccc;
                border-radius: 3px;
            }

            nav.sidebar::-webkit-scrollbar-thumb:hover {
                background: #999;
            }
        </style>
    </head>
    <body>
        <nav class="sidebar">
            <div class="sidebar-header">
                <span>Instagram</span>
                 <img src="instalogo.jpg" alt="Instagram Logo">

            </div>
            <ul>
                <li class="home">
                    <img src="home.png" alt="Home">
                    <p>Home</p>
                </li>
                <li>
                    <img src="search.png" alt="Search">
                    <p>Search</p>
                </li>
                <li>
                    <img src="explore.png" alt="Explore">
                    <p>Explore</p>
                </li>
                <li>
                    <img src="reels.png" alt="Reels">
                    <p>Reels</p>
                </li>
                <li class="class-tool-tip">
                    <img src="messages.png" alt="Messages" class="messages">
                    <div><p class="tool-tip">4</p></div>
                    <p>Messages</p>
                </li>
                <li>
                    <img src="notifications.png" alt="Notifications">
                    <p>Notifications</p>
                </li>
                <li>
                    <img src="create.png" alt="Create">
                    <p>Create</p>
                </li>
                <li>
                    <img class="profile" src="gear 5.webp" alt="Profile">
                    <p id="profileName">Profile</p>
                </li>
                <li>
                    <img src="meta ai.png" alt="Meta AI">
                    <p>Meta AI</p>
                </li>
                <li>
                    <img src="threads.png" alt="Threads">
                    <p>Threads</p>
                </li>
                <li>
                    <img src="menu.png" alt="More">
                    <p>More</p>
                </li>
                <li onclick="signOut()" style="margin-top: 20px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <p>Sign Out</p>
                </li>
            </ul>
        </nav>

        <script>
          window.onload = function() {
            var username = localStorage.getItem('instagramUsername');
            if (username) {
              document.getElementById('profileName').textContent = username;
            }
          };

          function signOut() {
            var confirmSignOut = confirm('Are you sure you want to sign out?');
            if (confirmSignOut) {
              localStorage.removeItem('instagramUsername');
              alert('You have been signed out successfully!');
              window.top.location.href = 'instalogin.html';
            }
          }
        </script>
    </body>
</html>
